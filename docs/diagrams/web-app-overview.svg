<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="48" y="54" font-size="32" font-weight="700" fill="#232738">Clip Insights / Your study library</text><text x="48" y="88" font-size="18" font-weight="400" fill="#586174">The web app connects saved study documents with everyday account management.</text>
<rect x="48" y="148" width="304" height="124" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="72" y="182" font-size="22" font-weight="650" fill="#232738">Save from the extension</text><text x="72" y="210" font-size="17" font-weight="400" fill="#586174">Create a study PDF</text><text x="72" y="235" font-size="17" font-weight="400" fill="#586174">Keep it in your account</text><path d="M 352 210 L 448 210" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="448" y="148" width="304" height="124" rx="12" fill="#eef0ff" stroke="#4255ff"/><rect x="448" y="164" width="4" height="92" rx="2" fill="#4255ff"/><text x="472" y="182" font-size="22" font-weight="650" fill="#232738">Your document library</text><text x="472" y="210" font-size="17" font-weight="400" fill="#586174">Find PDFs and search files</text><text x="472" y="235" font-size="17" font-weight="400" fill="#586174">Organize documents in folders</text><path d="M 752 210 L 848 210" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="848" y="148" width="304" height="124" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="872" y="182" font-size="22" font-weight="650" fill="#232738">Use your notes</text><text x="872" y="210" font-size="17" font-weight="400" fill="#586174">Open and revisit documents</text><text x="872" y="235" font-size="17" font-weight="400" fill="#586174">Rename, move, or remove files</text><path d="M 600 272 L 600 352" fill="none" stroke="#4255ff" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="448" y="352" width="704" height="124" rx="12" fill="#f6f7fb" stroke="#d6dae5"/><text x="472" y="386" font-size="22" font-weight="650" fill="#232738">Shared account and storage</text><text x="472" y="414" font-size="17" font-weight="400" fill="#586174">Sign in with email or Google · View storage and plan usage</text><text x="472" y="439" font-size="17" font-weight="400" fill="#586174">The backend manages account access and saved PDF documents</text><text x="48" y="392" font-size="22" font-weight="650" fill="#232738">Web dashboard</text><text x="48" y="424" font-size="17" font-weight="400" fill="#586174">The same account connects</text><text x="48" y="450" font-size="17" font-weight="400" fill="#586174">your study tools and library.</text>
